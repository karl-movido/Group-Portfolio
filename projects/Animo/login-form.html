<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles/login-form.css" />

        <title>Animo | Login</title>
    </head>
    <body>
        <main class="login-page">
            <div class="content">
                <section class="branding">
                    <h1 class="logo">Ani<span>mo</span></h1>
                    <p class="tagline">Your <span>harvest</span>, Your <span>success</span>.</p>
                </section>
                <section class="login-form" id="login-form">
                    <h2 class="greeting" id="greeting-text">Welcome back, <span>Farmer!</span></h2>

                    <h3 class="form-title">Log In</h3>

                    <div class="form-container">
                        <form action="">
                            <div class="form-group">
                                <input type="email" name="email" id="email" required />
                                <label for="email">Email</label>
                            </div>
                            <div class="form-group">
                                <input type="password" name="password" id="password" required />
                                <label for="password">Password</label>
                            </div>

                            <button type="submit" class="submit-btn">Log In</button>
                        </form>
                    </div>
                    <p class="create-account">No account yet? <a href="">Create account</a></p>
                    <p class="login-role">Log in as <a href="#" id="switch-role"></a></p>
                </section>
                <section class="register-form" id="register-form"></section>
            </div>
        </main>

        <script src="scripts/login-form.js"></script>
    </body>
</html>
