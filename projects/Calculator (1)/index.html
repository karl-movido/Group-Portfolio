<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Calculator</title>
  
  <!-- HTML -->
  

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="calculator">
    <div class="display">
      <input type="text" class="history"></input>
      <input type="text" class="screen"></input>
    </div>
    <div class="keys-container">
      <div class="keys">
        <button data-action="clear" class="clear">AC</button>
        <button data-action="delete" class="del">DEL</button>
        <button class="operator" data-action="percent">%</button>
        <button class="operator">/</button>
      </div>
      <div class="keys">
        <button class="num">7</button>
        <button class="num">8</button>
        <button class="num">9</button>
        <button class="operator">x</button>
      </div>
      <div class="keys">
        <button class="num">4</button>
        <button class="num">5</button>
        <button class="num">6</button>
        <button class="operator">-</button>
      </div>
      <div class="keys">
        <button class="num">1</button>
        <button class="num">2</button>
        <button class="num">3</button>
        <button class="operator">+</button>
      </div>
      <div class="keys">
        <button class="num">0</button>
        <button class="num">.</button>
        <button data-action="equal" class="equal">=</button>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
